name: Mirror to GitHub
on:
  push:
    branches: [main]
jobs:
  mirror:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitHub mirror
        run: git push "https://liebenl:${GH_MIRROR_TOKEN}@github.com/liebenl/ha-nut-full.git" HEAD:main
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
